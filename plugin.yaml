name: hermes-openpet-homeassistant
version: "0.2.0"
description: "Animate OpenPets desktop pet from Home Assistant state changes via WebSocket. Real-time, zero LLM, fully deterministic."
author: "ChromiteSoft"
license: MIT
homepage: "https://github.com/ChromiteSoft/hermes-openpet-homeassistant"
repository: "https://github.com/ChromiteSoft/hermes-openpet-homeassistant"

# Declare which lifecycle hooks this plugin registers.
# This plugin runs an internal background thread that subscribes to HA's
# WebSocket event stream — it does not register any Hermes lifecycle hooks.
hooks: []

# Platform support — pure Python + websockets, runs anywhere Python runs
platforms:
  - linux
  - macos
  - windows

# Optional runtime dependencies
python_dependencies:
  - websockets>=13.0

# Variables the user MUST set before enabling.
# The plugin still loads without them (becomes a no-op), but the user is
# prompted at install time.
requires_env:
  - HASS_TOKEN
  - OPENPET_HA_TOKEN

# Behaviour settings auto-populated in config.yaml on first run,
# then user-editable under plugins.entries.hermes-openpet-homeassistant.settings.*:
#   enabled          (bool, default true)  — master switch
#   debounce_seconds (float, default 2.0)  — skip same (entity, to_state) within window
#   include_entities (list, default [])    — empty = all; otherwise filter list
#   say_enabled      (bool, default true)  — send speech bubbles
